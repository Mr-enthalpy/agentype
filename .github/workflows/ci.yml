name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -t . -v

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test workspace
        # The external-consumer boundary fixture is excluded here and run on
        # its own below: `--all-features` switches `test-support` on, which is
        # exactly the configuration its compile-fail probes must NOT run in.
        run: cargo test --workspace --all-features --exclude agentype-public-api-boundary
      - name: Cargo test production API boundary fixture
        # Default features only. This is the compile-time evidence that a
        # consumer depending on `agentype-runtime` cannot construct a second
        # scheduler daemon, claim, or renewal control plane.
        run: cargo test -p agentype-public-api-boundary

[package]
name = "agentype-storage-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite WAL authority for the Agentype M4 kernel"
# Internal implementation crate: the supported Agentype production API is
# `agentype-runtime`. Direct `Kernel` use is not a supported production API
# and does not constitute a Scheduler runtime composition surface.
publish = false

[features]
test-support = []
# Runtime-mechanical Kernel surface. Claim, execution commitment, lease
# renewal, physical-history recording, worker ACK/NACK, recovery, and outbox
# delivery commits belong to the Runtime's mechanical path, not to the
# supported production API. They are compiled in only for this crate's own
# tests, for the `agentype-runtime` dependency that owns the daemon, and for
# repository test targets that deliberately drive the Kernel directly.
runtime-internal = []

# Every integration target below drives the Kernel's mechanical primitive
# surface directly (claim, execution commitment, renewal, ACK/NACK, physical
# history, recovery). Declaring the requirement keeps a default-feature
# `cargo test` buildable instead of failing to compile these targets, while
# the CI `--all-features` run still executes them.
[[test]]
name = "m4_kernel"
required-features = ["test-support"]

[[test]]
name = "supervision"
required-features = ["test-support"]

[[test]]
name = "outbox_delivery"
required-features = ["test-support"]

[[test]]
name = "reconciliation"
required-features = ["test-support"]

[[test]]
name = "recovery"
required-features = ["test-support"]

[[test]]
name = "topology"
required-features = ["test-support"]

# The production store contract: literal file-backed paths open, SQLite URI
# filenames are refused at the store boundary. This target needs no mechanical
# Kernel surface, so it runs under the default feature set as well.
[[test]]
name = "store_contract"

[dependencies]
agentype-core.workspace = true
agentype-execution-config.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json.workspace = true

[dev-dependencies]
agentype-adapter-api.workspace = true
agentype-execution-config = { workspace = true, features = ["test-support"] }
# Self dev-dependency: this crate's own integration targets are a separate
# crate, so they need the mechanical Kernel surface explicitly. Feature
# unification makes the flag apply to the library under test too.
agentype-storage-sqlite = { path = ".", features = ["runtime-internal"] }

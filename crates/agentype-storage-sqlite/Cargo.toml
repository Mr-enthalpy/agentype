[package]
name = "agentype-storage-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite WAL authority for the Agentype M4 kernel"
# Internal implementation crate: the supported Agentype production API is
# `agentype-runtime`. Direct `Kernel` use is not a supported production API
# and does not constitute a Scheduler runtime composition surface.
publish = false

[features]
test-support = []

# These two targets exercise the LEGACY M4 primitives `heartbeat` and
# `renew_supervised_execution`, which exist only under `test-support`.
# Declaring that requirement keeps a default-feature `cargo test` buildable
# instead of failing to compile these targets, while the CI `--all-features`
# run still executes them.
[[test]]
name = "m4_kernel"
required-features = ["test-support"]

[[test]]
name = "supervision"
required-features = ["test-support"]

[dependencies]
agentype-core.workspace = true
agentype-execution-config.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json.workspace = true

[dev-dependencies]
agentype-adapter-api.workspace = true
agentype-execution-config = { workspace = true, features = ["test-support"] }

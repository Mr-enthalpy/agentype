[workspace]
resolver = "2"
members = [
    "crates/agentype-core",
    "crates/agentype-agent-contract",
    "crates/agentype-execution-config",
    "crates/agentype-storage-sqlite",
    "crates/agentype-adapter-api",
    "crates/agentype-adapter-local-process",
    "crates/agentype-root-bridge",
    "crates/agentype-runtime",
    "crates/agentype-nlink",
    # External-consumer boundary fixture. It is a member so it must keep
    # compiling, but CI runs it as its own `cargo test -p` invocation: its
    # compile-fail probes are only meaningful under the DEFAULT feature set,
    # and the workspace `--all-features` run would switch `test-support` on.
    "tests/public-api",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
agentype-core = { path = "crates/agentype-core" }
agentype-agent-contract = { path = "crates/agentype-agent-contract" }
agentype-execution-config = { path = "crates/agentype-execution-config" }
agentype-adapter-api = { path = "crates/agentype-adapter-api" }
agentype-adapter-local-process = { path = "crates/agentype-adapter-local-process" }
agentype-root-bridge = { path = "crates/agentype-root-bridge" }
agentype-runtime = { path = "crates/agentype-runtime" }
agentype-storage-sqlite = { path = "crates/agentype-storage-sqlite" }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
fs4 = "0.13"
agentype-nlink = { path = "crates/agentype-nlink" }

schema_version = 1
database_path = ".local-agent-scheduler.db"
lease_seconds = 120
heartbeat_seconds = 30
continuity_max_bytes = 16384
dispatcher_poll_seconds = 1.0

[retry_defaults]
max_attempts = 3
retry_classes = ["TRANSIENT_EXTERNAL", "TIMEOUT", "EXECUTION_LOST", "RESOURCE_UNAVAILABLE"]
base_backoff_seconds = 1.0
max_backoff_seconds = 60.0

[execution_profiles.default]
model = "grok-build"

[[partitions]]
name = "general"
desired_capacity = 1
retention = "resident"
execution_target = "local_grok"
execution_profile = "default"
tags = []

[[execution_targets]]
name = "local_grok"
adapter = "grok_acp"
attempt_isolation = false
termination_confirmation = true

[adapters.grok_acp]
command = ["grok", "agent", "--always-approve", "stdio"]
cwd = "."
sandbox = "workspace"
request_timeout = 90

[root_bridge]
# Provider-free/local testing. Root remains notification-driven.
kind = "filesystem"
inbox = ".scheduler-root-events"
request_timeout = 30
completion_timeout = 120

[package]
name = "agentype-public-api-boundary"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published: this is a repository fixture that continuously proves the
# supported production API shape. It exists to fail the build, not to ship.
publish = false
description = "External-consumer boundary fixture: only agentype-runtime is a supported production dependency"

# Every boundary claim below is a rustdoc probe, so `cargo test -p
# agentype-public-api-boundary` builds this package against the DEFAULT feature
# set -- no `test-support`, and no `--all-features` unification with the rest of
# the workspace. That is the only configuration in which "not exposed through
# the supported production API" is testable at all, which is why CI runs this
# package as its own cargo invocation instead of inside the workspace run.
[lib]
path = "src/lib.rs"

[dependencies]
# The supported production dependencies, default features only. These are the
# crates a real host embedding the daemon would depend on: `agentype-runtime`
# for the daemon, `agentype-core` for the Scheduler data types, and
# `agentype-root-bridge` to implement the wakeup side channel.
agentype-runtime = { path = "../../crates/agentype-runtime" }
agentype-core = { path = "../../crates/agentype-core" }
agentype-root-bridge = { path = "../../crates/agentype-root-bridge" }
# Pure M6-B semantic kernel. This fixture also depends on `agentype-runtime`,
# so Cargo feature unification enables `provisioning-producer` here and the
# imported-enforcement constructors ARE visible (probe 31 records that). The
# contract-only absence is proved by `tests/public-api-contract-only`.
agentype-agent-contract = { path = "../../crates/agentype-agent-contract" }
serde_json = { workspace = true }

[dev-dependencies]
# The internal storage crate is not a supported production dependency, but the
# boundary fixture uses it (in a `compile_fail` probe only) to prove that the
# validated SourceConfig revision type has no externally reachable constructor.
agentype-storage-sqlite = { path = "../../crates/agentype-storage-sqlite" }

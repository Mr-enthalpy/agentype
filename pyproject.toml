[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-scheduler"
version = "0.1.1"
description = "A local-first, restart-safe scheduler for logical agent pools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mr-enthalpy" }]
dependencies = []

[project.scripts]
local-agent-scheduler = "local_agent_scheduler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
